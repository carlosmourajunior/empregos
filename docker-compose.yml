services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meuemprego
      POSTGRES_USER: meuemprego
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuemprego"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://meuemprego:${POSTGRES_PASSWORD}@db:5432/meuemprego
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Só escuta na máquina; quem publica para a internet é o Cloudflare Tunnel.
    ports:
      - "127.0.0.1:${PORTA:-8080}:80"

  # Cópia do banco todo dia, guardada em ./backups (as dos últimos 14 dias).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: meuemprego
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: meuemprego
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          arquivo=/backups/meuemprego-$$(date +%Y-%m-%d).sql.gz
          pg_dump --no-owner | gzip > $$arquivo.tmp && mv $$arquivo.tmp $$arquivo && echo "backup ok: $$arquivo"
          find /backups -name 'meuemprego-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  dados_postgres:
